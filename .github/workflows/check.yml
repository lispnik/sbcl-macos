# The checks that need no Mac.
#
# The full system cannot be LOADED off macOS -- lispnik/objc opens
# /usr/lib/libobjc.A.dylib as it initializes -- but src/ can be compiled against
# a stand-in for the frameworks, and the listener half of it can then be RUN on
# that stand-in.  So three questions get answered without a Mac: does it parse,
# does it compile, and does the listener work.  The last one covers the thread,
# the streams, the reader, the debugger and the interactive restarts; it covers
# nothing with a window in it, which is macos.yml's job.
#
# It is here as its own workflow, and on ubuntu, because it answers in seconds
# and should not be queued behind a macOS runner or a three-minute SBCL build.

name: check

on:
  push:
  pull_request:

jobs:
  check:
    name: parse, compile and run
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Report the environment
        run: sbcl --version

      - name: Check
        run: make check
